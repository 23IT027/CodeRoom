<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 290 50" fill="none">
  <defs>
    <linearGradient id="cr-emblem-bg" x1="0" y1="0" x2="42" y2="42" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2D313A" />
      <stop offset="100%" stop-color="#1A1C21" />
    </linearGradient>
    <linearGradient id="cr-accent-grad" x1="0" y1="0" x2="42" y2="42" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#39E079" />
      <stop offset="100%" stop-color="#22C55E" />
    </linearGradient>
    <filter id="cr-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Code Room Emblem Badge -->
  <g transform="translate(4, 4)">
    <!-- Container Badge -->
    <rect x="0" y="0" width="42" height="42" rx="10" fill="url(#cr-emblem-bg)" stroke="#39E079" stroke-opacity="0.5" stroke-width="1.5" />
    
    <!-- Code Brackets & Slash -->
    <path d="M14 15L7 21L14 27" stroke="#39E079" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M24 13L18 29" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" />
    <path d="M28 15L35 21L28 27" stroke="#39E079" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Real-time Status Indicator -->
    <circle cx="34" cy="8" r="3" fill="#39E079" filter="url(#cr-glow)" />
    <circle cx="34" cy="8" r="1.5" fill="#FFFFFF" />
  </g>

  <!-- Typography: Code Room -->
  <g transform="translate(58, 29)">
    <text font-family="'Space Grotesk', 'Poppins', -apple-system, sans-serif" font-size="24" font-weight="800" letter-spacing="-0.5">
      <tspan fill="#FFFFFF">Code</tspan>
      <tspan dx="4" fill="#39E079">Room</tspan>
    </text>
  </g>

  <!-- Tagline: Real-time collaborative code editor -->
  <g transform="translate(59, 42)">
    <text font-family="'Space Grotesk', 'Poppins', -apple-system, sans-serif" font-size="6.8" font-weight="600" fill="#9CA3AF" letter-spacing="0.8">REAL-TIME COLLABORATIVE CODE EDITOR</text>
  </g>
</svg>